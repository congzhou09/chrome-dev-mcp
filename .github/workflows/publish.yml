# Publishes a release when a version tag is pushed. npm comes first: the MCP Registry rejects a version
# that is not on npm yet. Both login with GitHub OIDC, so no secret is needed.
# npm's trusted publisher setting names this file. Renaming the file means creating that setting again.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against package.json
        run: |
          version="$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # trusted publishing needs npm 11.5.1 or later
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # npm's guide advises no cache in release builds

      # Installs the pnpm version named by packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Check that the committed dist matches the build
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "dist differs from a fresh build. Run pnpm build, commit dist, then move the tag to that commit and push it again." >&2
            exit 1
          fi

      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run

      # A version already on npm is not published again, so re-running all jobs still reaches the MCP Registry.
      - name: Publish to npm
        run: |
          version="$(jq -r .version package.json)"
          if [ -n "$(npm view "chrome-dev-mcp@$version" version 2>/dev/null)" ]; then
            echo "::notice::chrome-dev-mcp@$version is already on npm, so it is not published again"
          else
            npm publish
          fi

  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.9

    steps:
      - uses: actions/checkout@v7

      # Both version fields of server.json are set here, so a release does not bump them by hand.
      - name: Set server.json version from package.json
        run: |
          version="$(jq -r .version package.json)"
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > "$RUNNER_TEMP/server.json"
          mv "$RUNNER_TEMP/server.json" server.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Pinned, and checked against its Sigstore bundle before it runs. To upgrade, change MCP_PUBLISHER_VERSION.
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
